<style>
:root{--ink:#12394a;--paper:#fff3cf;--gold:#f5b81c;--coral:#ff6f59;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#06222d;overflow:hidden;font-family:'Baloo 2','Trebuchet MS',sans-serif;color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}

#stats{right:40px;top:28px;font-size:38px;height:96px;box-sizing:border-box;gap:26px}
button{font:inherit;font-weight:800;color:var(--ink);background:var(--gold);border:5px solid var(--ink);border-radius:26px;box-shadow:0 5px 0 var(--ink);padding:4px 26px;font-size:34px;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#stats button{padding:0;width:62px;height:62px;border-radius:50%;font-size:32px;background:#fff}
#win{left:50%;bottom:36px;transform:translateX(-50%);flex-direction:column;gap:8px;padding:18px 54px;text-align:center}
#win h1{margin:0;font-size:68px;line-height:1;font-weight:800}
#win p{margin:0;font-size:32px}
#win div{display:flex;gap:18px;margin-top:6px}
.hidden{display:none!important}

 c.save();c.translate(t.x+(t.shake>0?Math.sin(time*70)*12*Math.min(1,t.shake):0),t.y+Math.sin(time*1.5+t.ph)*5);

  [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,f*1.01,.22,'triangle',.18,i*.13));noise(.6,900,.2);
  for(let i=0;i<120;i++)burst()}
 else{errors++;t.shake=1;t.mark=1.6;tone(420,130,.5,'sine',.25);tone(210,90,.4,'square',.05,.05)}}
function burst(){const cols=['#ffd02e','#ff6f59','#fff3cf','#8be3ea','#b6e07a','#ff9ecb'];conf.push({x:960+rnd(-60,60),y:560,vx:rnd(-900,900),vy:rnd(-1200,-200),c:pick(cols),r:rnd(0,6),vr:rnd(-9,9),s:rnd(10,22),life:rnd(2,4),circ:Math.random()<.4})}
$('mu').onclick=()=>{muted=!muted;$('mu').textContent=muted?'🔇':'🔊'};
$('re').onclick=$('again').onclick=()=>{newRound()};
$('next').onclick=()=>{location.href='MiniJeu5.html'};
/* boucle */
function update(dt){time+=dt;if(!turtles.length)return;
 const f=Math.pow(.02,dt);
 for(const t of tufts){if(t===(drag&&drag.t)){t.vx*=Math.pow(.0005,dt);t.vy*=Math.pow(.0005,dt);continue}
  t.x+=t.vx*dt;t.y+=t.vy*dt;if(!win){t.vx*=f;t.vy*=f;if(Math.abs(t.vx)<3)t.vx=0;if(Math.abs(t.vy)<3)t.vy=0}
  if(t.x<-350){t.x=-350;t.vx=Math.abs(t.vx)*.3}if(t.x>2270){t.x=2270;t.vx=-Math.abs(t.vx)*.3}if(t.y<-100)t.y=-100;if(t.y>1300)t.y=1300;
  if(Math.hypot(t.vx,t.vy)>400&&Math.random()<.2)bubble(t.x+rnd(-60,60),t.y+rnd(-250,0))}
 for(const t of turtles){if(t.shake>0)t.shake-=dt*1.5;if(t.mark>0)t.mark-=dt}
 if(Math.random()<.08)bubble(rnd(0,W),H-rnd(0,100));
 bubbles=bubbles.filter(b=>(b.life-=dt)>0&&b.y>-20);bubbles.forEach(b=>{b.y-=b.vy*dt;b.x+=Math.sin(time*2+b.ph)*18*dt});
 if(win){winT+=dt;const t=goodT;t.x+=(960-t.x)*3.2*dt;t.y+=(520-t.y)*3.2*dt;t.sc+=(2.4-t.sc)*3*dt;let d=-t.a;d=Math.atan2(Math.sin(d),Math.cos(d));t.a+=d*3*dt;
  if(winT<3&&Math.random()<.5)for(let i=0;i<3;i++)burst();if(Math.random()<.5)bubble(960+rnd(-300,300),H);
  if(winT>1.4)$('win').classList.remove('hidden')}
 conf=conf.filter(p=>(p.life-=dt)>0);conf.forEach(p=>{p.vy+=1400*dt;p.vx*=Math.pow(.4,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt});
 if(!win){const m=fmt(time-t0);if(m!==lm){lm=m;$('tm').textContent=m}}if(errors!==le){le=errors;$('er').textContent='Oups : '+errors}}
function draw(){const c=ctx;c.drawImage(BG,0,0);
 c.fillStyle='rgba(255,255,255,.07)';for(let i=0;i<6;i++){const x=i*340+Math.sin(time*.3+i)*60;c.beginPath();c.moveTo(x,0);c.lineTo(x+150,0);c.lineTo(x+20+Math.sin(time*.4+i)*50,H);c.lineTo(x-330,H);c.fill()}
 for(const t of turtles)if(!t.win)drawTurtle(c,t,time);
 drawTufts(c);
 if(win){const t=goodT;c.save();c.translate(t.x,t.y);c.rotate(time*.5);c.fillStyle='rgba(255,226,120,.28)';for(let i=0;i<12;i++){c.rotate(Math.PI/6);c.beginPath();c.moveTo(0,0);c.lineTo(900,-90);c.lineTo(900,90);c.fill()}c.restore();drawTurtle(c,t,time)}
 c.lineWidth=2;c.strokeStyle='rgba(255,255,255,.8)';c.fillStyle='rgba(255,255,255,.22)';
 for(const b of bubbles){c.beginPath();c.arc(b.x,b.y,b.r,0,7);c.fill();c.stroke()}
 for(const p of conf){c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;if(p.circ){c.beginPath();c.arc(0,0,p.s/2,0,7);c.fill()}else c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore()}}
let last=performance.now(),lm='',le=-1;
function frame(n){const dt=Math.min(.04,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(frame)}
function fit(){const s=Math.min(innerWidth/W,innerHeight/H),st=$('stage');st.style.transform='scale('+s+')';st.style.left=(innerWidth-W*s)/2+'px';st.style.top=(innerHeight-H*s)/2+'px'}
addEventListener('resize',fit);fit();
BG=mkBG();Promise.all([load(IMG_T),load(IMG_A)]).then(([a,b])=>{AIMG=b;TIM=mkTurt(a);VAR=mkVar();newRound();last=performance.now();requestAnimationFrame(frame)});
