<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tortue Crossy</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b2a3d; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: min(100vw, calc(100vh * 528 / 672)); aspect-ratio: 528 / 672; touch-action: none; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="c" width="528" height="672" aria-label="Tortue Crossy : traverse la plage jusqu'à la mer"></canvas>
</div>
<script>
// ---------- Constantes ----------
const COLS = 11, CELL = 48, ROWS = 14, W = COLS * CELL, H = ROWS * CELL;
const GOAL = 50;   // rangée où commence la mer
const BACK = 4;    // recul maximum sous le meilleur score
const FONT = "'Trebuchet MS','Segoe UI',Verdana,sans-serif";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- Décor animé WebGL : plage et mer (inspiré de « Plage des tortues ») ----------
// Sable : grain, rides, traînées de vent, grains soufflés, scintillements, ombres de nuages.
// Mer : dégradé turquoise -> bleu, caustiques, lignes de vagues qui roulent vers le rivage,
// écume dentelée, et nappe d'eau qui monte sur le sable puis se retire (sable mouillé).
const VS = `attribute vec2 aP; varying vec2 vUv; void main(){ vUv = aP*.5+.5; vUv.y = 1.-vUv.y; gl_Position = vec4(aP,0.,1.); }`;
const FS = `
precision highp float;
varying vec2 vUv;
uniform float uT, uCam;
uniform vec2 uRes;
const float SHORE = ${GOAL * CELL}.0;   // hauteur monde du rivage (début de la mer)

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<4;i++){ v+=a*noise(p); p=p*2.03+17.1; a*=.5; } return v; }
float caustic(vec2 uv, float t){
  vec2 p = mod(uv*6.28318, 6.28318) - 250.; vec2 i = p; float c = 1.; float inten = .005;
  for (int n = 0; n < 4; n++) { float tt = t * (1. - (3.5 / float(n+1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1. / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten))); }
  c /= 4.; c = 1.17 - pow(abs(c), 1.4); return pow(abs(c), 8.);
}

void main(){
  float t = uT;
  vec2 p = vec2(vUv.x*uRes.x, uCam + (1.-vUv.y)*uRes.y);   // coordonnées monde (y vers le haut)
  float sd = p.y - SHORE;                                    // > 0 : en mer, < 0 : sur le sable
  float nb = noise(p*.008)*.7 + noise(p*.03)*.15;
  float ph = sd/56. + t*.22 + nb;                            // les crêtes avancent vers le rivage
  float f = fract(ph);
  float lace = smoothstep(.3, .7, noise(p*.09 + vec2(t*.25, -t*.1)));
  float bnd = smoothstep(.5, .78, noise(p*.0028 + vec2(t*.05, -t*.025)));
  vec3 col;

  if (sd > 0.) {
    // ---- MER ----
    vec3 sea = mix(vec3(.45,.84,.84), vec3(.169,.608,.769), smoothstep(0., 140., sd));   // turquoise -> #2b9bc4
    sea = mix(sea, vec3(.12,.47,.66), smoothstep(250., 900., sd)*.7);
    vec2 w = vec2(noise(p*.012 + vec2(t*.2, t*.12)), noise(p*.012 + vec2(31.7 - t*.15, 12.3 + t*.18))) - .5;
    float ca = caustic(p/170. + w*.02, t*.3) + .55*caustic(p/102. + 3.1, t*.25 + 4.);
    sea += vec3(.85, 1., .95) * ca * .16 * (1. - smoothstep(0., 520., sd)*.7);
    sea *= 1. + sin(ph*6.2832) * .05 * (1. - smoothstep(40., 260., sd));      // houle : lumière et ombre
    float brk = mix(.45, 1., 1. - smoothstep(6., 120., sd));                 // écume forte près du bord
    float crest = smoothstep(0., .03, f) * (1. - smoothstep(.03, .11, f));
    float trail = step(.08, f) * (1. - smoothstep(.08, .4, f)) * smoothstep(.66, .86, noise(p*.13 - vec2(t*.15, t*.3)));
    float foam = (crest*(.4 + lace*.8) + trail*.4) * brk;
    float wash = (1. - smoothstep(0., 9., sd)) * (.3 + .7*smoothstep(.45, .7, noise(p*.07 + t*.4)));
    col = mix(sea, vec3(.97, .99, 1.), clamp(foam + wash*.55, 0., 1.));
  } else {
    // ---- SABLE ----
    float odd = mod(floor(p.y/48.), 2.);
    vec3 sand = mix(vec3(.945,.851,.627), vec3(.918,.816,.584), odd);     // bandes #f1d9a0 / #ead095
    sand *= .965 + .07*(noise(p*.9)*.5 + noise(p*.23)*.5);                 // grain
    sand *= 1. + .018*sin(p.y*.35 + noise(p*.02)*6.);                      // rides
    vec2 wd = normalize(vec2(1., .25));
    vec2 pw = vec2(dot(p, wd), dot(p, vec2(-wd.y, wd.x)));
    float gust = smoothstep(.38, .72, fbm(pw*vec2(.0028, .006) - vec2(t*.22, 0.)));
    float streak = smoothstep(.55, .95, noise(vec2((pw.x - t*170.)*.018, pw.y*.22)))
                 * smoothstep(.3, .8, noise(vec2((pw.x - t*90.)*.005, pw.y*.04)));
    sand = mix(sand, vec3(1., .94, .8), streak*gust*.3);                  // traînées de vent
    for (int l = 0; l < 2; l++) {                                          // grains de sable soufflés
      float fl = float(l);
      vec2 q = pw - vec2(t*(230. + fl*90.), fl*3.7);
      vec2 cs = vec2(10. + fl*4., 5.);
      vec2 ce = floor(q/cs); float h2 = hash(ce + fl*13.);
      vec2 g = q - (ce + .5)*cs;
      float gr = exp(-(g.x*g.x/(7. + fl*5.) + g.y*g.y/.35)) * step(.9, h2);
      sand = mix(sand, vec3(.62, .53, .38), clamp(gr*gust, 0., 1.)*.8);
    }
    // nappe d'eau qui monte sur le sable puis se retire
    float ps = fract(t*.22 + nb);
    float r = ps < .3 ? smoothstep(0., .3, ps) : 1. - smoothstep(.3, 1., ps);
    float dl = -sd;
    float RU = r * 46. * (.65 + .55*noise(p*.012 + 4.));
    float cover = 1. - smoothstep(RU - 2., RU + 1., dl);
    float wet = 1. - smoothstep(0., 56., dl);
    sand *= 1. - .2*wet*(1. - cover);                                      // sable mouillé
    cover *= mix(.35, 1., 1. - clamp(dl/max(RU, 1.), 0., 1.));
    sand = mix(sand, sand*vec3(.8, .93, .94) + vec3(.02, .08, .09), cover*.55);
    float lip = exp(-abs(dl - RU)/1.6) * step(.5, RU) * (.35 + .65*lace) * smoothstep(0., .25, r);
    col = mix(sand, vec3(.98, .99, 1.), clamp(lip, 0., 1.)*.9);            // liseré d'écume
  }

  // scintillements du soleil sur l'eau et le sable
  vec2 cell = floor(p/8.); float h = hash(cell);
  if (h > .92) {
    vec2 c = (cell + .2 + .6*vec2(hash(cell + 3.1), hash(cell + 7.7))) * 8.;
    vec2 g = abs(p - c);
    float tw = pow(max(0., sin(t*(1.6 + h*3.) + h*61.)), 18.);
    float star = exp(-dot(g, g)/3.) + exp(-g.y*1.5)*exp(-g.x/3.4)*.55 + exp(-g.x*1.5)*exp(-g.y/3.4)*.55;
    col += vec3(1., .98, .92) * star * tw * bnd * (sd > 0. ? 1.2 : .55);
  }
  // ombres de nuages qui passent, vignette légère
  col *= 1. - .1*smoothstep(.48, .78, fbm(p*.0025 + vec2(t*.008, t*.0035)));
  vec2 vv = vUv - .5; col *= 1. - .22*dot(vv, vv)*1.6;
  gl_FragColor = vec4(col, 1.);
}`;

const glc = document.getElementById('gl');
const gl = glc.getContext('webgl', { antialias: false, alpha: false });
const GLU = {};
function initGL() {
  if (!gl) return false;
  try {
    const mk = (type, src) => {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const pr = gl.createProgram();
    gl.attachShader(pr, mk(gl.VERTEX_SHADER, VS));
    gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, FS));
    gl.bindAttribLocation(pr, 0, 'aP');
    gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    gl.useProgram(pr);
    ['uT', 'uCam', 'uRes'].forEach(n => GLU[n] = gl.getUniformLocation(pr, n));
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    return true;
  } catch (e) {
    console.warn('WebGL indisponible, décor 2D simple utilisé :', e);
    glc.style.display = 'none';
    return false;
  }
}
const USE_GL = initGL();

function drawGL(now) {
  const k = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.min(Math.round(glc.clientWidth * k), Math.round(W * 1.5)) || W, h = Math.round(w * H / W);
  if (glc.width !== w || glc.height !== h) { glc.width = w; glc.height = h; }
  gl.viewport(0, 0, w, h);
  gl.uniform1f(GLU.uT, now * 0.001);
  gl.uniform1f(GLU.uCam, camY);
  gl.uniform2f(GLU.uRes, W, H);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}


let seed, rows, P, best, camY, T, state, endT, moved, btn = null;

// ---------- Aléatoire reproductible ----------
function rng(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- Génération des rangées ----------
function getRow(r) {
  if (rows[r]) return rows[r];
  const q = rng(seed + r * 9973);
  const row = { r, g: null, stones: [] };
  // ~45 % de rangées avec mouettes, sauf les 3 premières
  if (r >= 3 && r < GOAL && q() < 0.45) {
    const items = [];
    let cells = 0;
    while (cells < 16) {
      const n = q() < 0.5 ? 1 : 2;                       // groupe de 1 à 2 mouettes
      for (let i = 0; i < n; i++) items.push(cells + i);
      cells += n + 3 + Math.floor(q() * 4);              // espace de 3 à 6 cases
    }
    row.g = {
      dir: q() < 0.5 ? -1 : 1,
      speed: (45 + r * 3.2) * (0.85 + q() * 0.3),        // plus vite en avançant
      items, L: cells * CELL, phase: q() * cells * CELL
    };
  }
  if (r < GOAL) {
    const n = Math.floor(q() * 4);
    for (let i = 0; i < n; i++) {
      row.stones.push({ x: q() * W, y: 8 + q() * 32, rx: 2.5 + q() * 3.5, ry: 2 + q() * 2.5, c: q() < 0.5 ? '#b9b3a4' : '#a39d90' });
    }
  }
  return rows[r] = row;
}
const gullX = (row, i) => {
  const g = row.g;
  return (((g.items[i] * CELL + g.phase + g.dir * g.speed * T) % g.L) + g.L) % g.L - 96;
};

// ---------- État du jeu ----------
function reset() {
  seed = (Math.random() * 1e9) | 0;
  rows = {};
  P = { c: 5, r: 0, vx: 5 * CELL, vy: 0, fx: 5 * CELL, fy: 0, hop: 1, ang: 0, anim: 0 };
  best = 0; camY = -2 * CELL; T = 0; endT = 0; moved = false; state = 'play'; btn = null;
}

function move(dc, dr) {
  if (state !== 'play') return;
  const nc = P.c + dc, nr = P.r + dr;
  if (nc < 0 || nc >= COLS || nr < best - BACK) return;
  P.fx = P.vx; P.fy = P.vy; P.c = nc; P.r = nr; P.hop = 0;
  P.ang = dr > 0 ? 0 : dr < 0 ? Math.PI : dc > 0 ? Math.PI / 2 : -Math.PI / 2;
  moved = true;
  if (nr > best) best = nr;
  if (nr >= GOAL) { best = GOAL; state = 'won'; endT = 0; }
  else checkHit();
}

function checkHit() {
  const row = getRow(P.r);
  if (!row.g) return;
  const px = P.c * CELL + 24;
  for (let i = 0; i < row.g.items.length; i++) {
    if (Math.abs(gullX(row, i) + 24 - px) < 33) { state = 'dead'; endT = 0; return; }
  }
}

function update(dt) {
  // Animation de nage : lente à l'arrêt, rapide pendant un saut
  P.anim += dt * (P.hop < 1 ? 40 : 6);
  // Animation du petit saut
  if (P.hop < 1) {
    P.hop = Math.min(1, P.hop + dt / 0.13);
    P.vx = P.fx + (P.c * CELL - P.fx) * P.hop;
    P.vy = P.fy + (P.r * CELL - P.fy) * P.hop;
  }
  if (state !== 'play') { endT += dt; return; }

  T += dt;
  // L'écran monte tout seul, de plus en plus vite
  camY += (9 + best * 0.85) * dt;
  // ... et suit le joueur
  const target = (best - 3) * CELL;
  if (target > camY) camY += (target - camY) * Math.min(1, dt * 5);

  checkHit();
  if (state === 'play' && P.r * CELL + 24 < camY) { state = 'dead'; endT = 0; }
}

// ---------- Dessin ----------
const sy = r => H - ((r + 1) * CELL - camY);   // y écran du haut de la rangée r

function drawRow(r, now) {
  const row = getRow(r), top = sy(r);
  if (r >= GOAL) {
    if (USE_GL) return;   // la mer est dessinée par le shader
    ctx.fillStyle = '#2b9bc4';
    ctx.fillRect(0, top, W, CELL + 1);
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (const k of [0.28, 0.72]) {
      ctx.beginPath();
      for (let x = -6; x <= W + 6; x += 6) {
        const y = top + CELL * k + Math.sin(x * 0.05 + now * 0.002 * (k > 0.5 ? -1 : 1) + r * 1.3) * 4;
        x === -6 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    if (r === GOAL) {   // écume au bord de la mer
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 6;
      ctx.beginPath();
      for (let x = -6; x <= W + 6; x += 6) {
        const y = top + 3 + Math.sin(x * 0.07 + now * 0.003) * 2.5;
        x === -6 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    return;
  }
  if (!USE_GL) {
    ctx.fillStyle = (r & 1) ? '#ead095' : '#f1d9a0';
    ctx.fillRect(0, top, W, CELL + 1);
  }
  for (const s of row.stones) {
    ctx.fillStyle = 'rgba(90,70,40,.18)';   // petite ombre du caillou
    ctx.beginPath(); ctx.ellipse(s.x + 1.5, top + s.y + 1.5, s.rx, s.ry, 0, 0, 7); ctx.fill();
    ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.ellipse(s.x, top + s.y, s.rx, s.ry, 0, 0, 7); ctx.fill();
  }
}

function drawGull(x, top, dir, now, ph) {
  const bob = Math.sin(now * 0.006 + ph) * 3;
  const cx = x + 24, cy = top + 18 + bob;
  // ombre au sol
  ctx.fillStyle = 'rgba(60,45,20,.22)';
  ctx.beginPath(); ctx.ellipse(cx, top + 40, 15 - bob * 0.5, 5 - bob * 0.2, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(cx, cy); ctx.scale(dir, 1);
  // queue
  ctx.fillStyle = '#f2f2f2';
  ctx.beginPath(); ctx.moveTo(-13, -2); ctx.lineTo(-26, -6); ctx.lineTo(-24, 3); ctx.closePath(); ctx.fill();
  // corps
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#d6dbde'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, 0, 15, 8, 0, 0, 7); ctx.fill(); ctx.stroke();
  // aile grise qui bat
  ctx.save(); ctx.translate(2, -3); ctx.rotate(-0.35 + Math.sin(now * 0.016 + ph) * 0.8);
  ctx.fillStyle = '#8f989e';
  ctx.beginPath(); ctx.moveTo(8, 0); ctx.quadraticCurveTo(0, -26, -26, -26);
  ctx.quadraticCurveTo(-14, -10, -8, 4); ctx.closePath(); ctx.fill();
  ctx.restore();
  // tête, bec, œil
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(13, -5, 6.2, 0, 7); ctx.fill();
  ctx.fillStyle = '#f39c12';
  ctx.beginPath(); ctx.moveTo(18, -7.5); ctx.lineTo(28, -4); ctx.lineTo(18, -1.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(15.5, -6.5, 1.7, 0, 7); ctx.fill();
  ctx.restore();
}

const FR = 128;            // taille d'une image dans la feuille
const TURTLE_SIZE = 72;    // taille d'affichage à l'écran (px)
const sheet = new Image();
let sheetGray = null;      // version grise, utilisée quand la tortue est morte
sheet.onload = () => {
  const c = document.createElement('canvas');
  c.width = sheet.width; c.height = sheet.height;
  const g = c.getContext('2d');
  g.drawImage(sheet, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const l = (p[i] * 0.3 + p[i + 1] * 0.59 + p[i + 2] * 0.11) * 0.9;
    p[i] = p[i + 1] = p[i + 2] = l;
  }
  g.putImageData(d, 0, 0);
  sheetGray = c;
};
sheet.src = 'data:image/png;base64,' + SPRITE_B64;

function drawTurtle(x, y, ang, dead, lift) {
  // ombre
  ctx.fillStyle = 'rgba(60,45,20,.25)';
  ctx.beginPath(); ctx.ellipse(x, y + 3, 18 - lift * 0.25, 15 - lift * 0.2, 0, 0, 7); ctx.fill();
  if (!sheet.complete || !sheet.naturalWidth) return;
  const f = dead ? 0 : Math.floor(P.anim) % 8;       // image d'animation
  const img = dead && sheetGray ? sheetGray : sheet;
  const s = TURTLE_SIZE * (1 + lift * 0.006);
  ctx.save(); ctx.translate(x, y - lift); ctx.rotate(ang);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, (f % 4) * FR, Math.floor(f / 4) * FR, FR, FR, -s / 2, -s / 2, s, s);
  ctx.restore();
}

function pill(x, y, w, h, fill) {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill();
}

function draw(now) {
  if (USE_GL) drawGL(now);
  ctx.clearRect(0, 0, W, H);
  const r0 = Math.floor(camY / CELL) - 1, r1 = Math.ceil((camY + H) / CELL) + 1;
  for (let r = r0; r <= r1; r++) drawRow(r, now);

  for (let r = r0; r <= r1; r++) {
    const row = getRow(r);
    if (!row.g) continue;
    const top = sy(r);
    for (let i = 0; i < row.g.items.length; i++) {
      const x = gullX(row, i);
      if (x > -50 && x < W + 2) drawGull(x, top, row.g.dir, now, i * 1.7 + r);
    }
  }

  const lift = Math.sin(Math.PI * P.hop) * 12;
  const ty = H - (P.vy + CELL - camY);
  drawTurtle(P.vx + 24, ty + 24, P.ang, state === 'dead', lift);

  // Score
  pill(12, 12, 108, 38, 'rgba(11,42,61,.55)');
  ctx.fillStyle = '#fff'; ctx.font = `bold 22px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(`${Math.min(best, GOAL)} / ${GOAL}`, 66, 32);

  if (!moved && state === 'play') {
    pill(W / 2 - 150, H - 48, 300, 32, 'rgba(11,42,61,.55)');
    ctx.fillStyle = '#fff'; ctx.font = `16px ${FONT}`;
    ctx.fillText('Flèches, ZQSD ou WASD pour avancer', W / 2, H - 32);
  }

  if (state !== 'play' && endT > 0.45) drawEnd();
}

function drawEnd() {
  const won = state === 'won';
  ctx.fillStyle = 'rgba(11,42,61,.55)'; ctx.fillRect(0, 0, W, H);
  const cw = 400, ch = 210, cx = (W - cw) / 2, cy = (H - ch) / 2 - 20;
  ctx.fillStyle = '#fff8e6'; ctx.beginPath(); ctx.roundRect(cx, cy, cw, ch, 20); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#1f4a57';
  ctx.font = `bold 28px ${FONT}`;
  ctx.fillText(won ? '🎉 La mer ! Tu as gagné !' : `Perdu ! Score ${best}`, W / 2, cy + 60);
  ctx.font = `17px ${FONT}`; ctx.fillStyle = '#5b7780';
  ctx.fillText('Espace pour rejouer', W / 2, cy + 98);
  btn = { x: W / 2 - 80, y: cy + ch - 74, w: 160, h: 50 };
  ctx.fillStyle = '#e8742c'; ctx.beginPath(); ctx.roundRect(btn.x, btn.y, btn.w, btn.h, 25); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = `bold 22px ${FONT}`;
  ctx.fillText('Rejouer', W / 2, btn.y + btn.h / 2 + 1);
}

// ---------- Commandes ----------
const KEYS = {
  arrowup: [0, 1], z: [0, 1], w: [0, 1],
  arrowdown: [0, -1], s: [0, -1],
  arrowleft: [-1, 0], q: [-1, 0], a: [-1, 0],
  arrowright: [1, 0], d: [1, 0]
};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ' || k.startsWith('arrow')) e.preventDefault();
  if (e.repeat) return;                       // un appui = une case
  if (k === ' ') { if (state !== 'play') reset(); return; }
  const m = KEYS[k];
  if (m) move(m[0], m[1]);
});

function canvasPos(e) {
  const b = cv.getBoundingClientRect();
  return { x: (e.clientX - b.left) * W / b.width, y: (e.clientY - b.top) * H / b.height };
}
const inBtn = p => btn && state !== 'play' && endT > 0.45 && p.x > btn.x && p.x < btn.x + btn.w && p.y > btn.y && p.y < btn.y + btn.h;
cv.addEventListener('click', e => { if (inBtn(canvasPos(e))) reset(); });
cv.addEventListener('mousemove', e => { cv.style.cursor = inBtn(canvasPos(e)) ? 'pointer' : 'default'; });

// ---------- Boucle ----------
let last = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t;
  update(dt);
  draw(t);
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
