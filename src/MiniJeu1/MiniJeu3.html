<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sauve la tortue caouanne</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea-top:#1fb6c9; --sea-mid:#0e7fa8; --sea-deep:#093b66;
  --card:rgba(255,251,240,.93); --ink:#1c2f3e; --muted:#4c6272;
  --sand:#f3dfa8; --coral:#f2715b; --good:#1f9d6b; --bad:#d6453d; --line:#cfe3e8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sea-top:#128a9b; --sea-mid:#0a5a7c; --sea-deep:#051f3a; --card:rgba(20,38,52,.92); --ink:#eaf4f6; --muted:#a9c2cc; --line:#2d4a5a; --sand:#e6cf90; }
}
:root[data-theme="dark"]{ --sea-top:#128a9b; --sea-mid:#0a5a7c; --sea-deep:#051f3a; --card:rgba(20,38,52,.92); --ink:#eaf4f6; --muted:#a9c2cc; --line:#2d4a5a; --sand:#e6cf90; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Nunito",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--sea-top) 0%,var(--sea-mid) 45%,var(--sea-deep) 100%);background-color:var(--sea-mid);
  overflow-x:hidden;position:relative}
/* sunlight rays */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(105deg,rgba(255,255,255,.07) 0 60px,transparent 60px 160px);
  mask-image:linear-gradient(180deg,#000,transparent 70%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%)}
#sea{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.swimmer{position:absolute;left:0;will-change:transform;animation-timing-function:linear;animation-iteration-count:infinite}
.swimmer img{display:block;width:100%;height:auto;animation:bob 4s ease-in-out infinite}
.swimmer.l img{transform:scaleX(-1)}
@keyframes goR{from{transform:translateX(-340px)}to{transform:translateX(calc(100vw + 340px))}}
@keyframes goL{from{transform:translateX(calc(100vw + 340px))}to{transform:translateX(-340px)}}
@keyframes bob{0%,100%{translate:0 0;rotate:-2deg}50%{translate:0 -14px;rotate:2deg}}
.bubble{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh)}}
main{position:relative;z-index:2;max-width:680px;margin:0 auto;padding:28px 16px 48px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.card{background:var(--card);border-radius:28px;padding:28px 26px;box-shadow:0 18px 50px rgba(3,30,55,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
h1,h2{font-family:"Fredoka",system-ui,sans-serif;margin:0;line-height:1.1}
h1{font-size:clamp(2.1rem,7vw,3.2rem);font-weight:600}
h2{font-size:clamp(1.35rem,4.5vw,1.8rem);font-weight:500;line-height:1.25}
p{line-height:1.55;margin:.7em 0}
.lead{color:var(--muted);font-size:1.08rem}
.hero-turtle{width:min(260px,70%);display:block;margin:0 auto 10px;animation:bob 4s ease-in-out infinite}
.btn{font-family:"Fredoka",system-ui,sans-serif;font-size:1.15rem;font-weight:500;border:0;border-radius:999px;padding:14px 30px;background:var(--coral);color:#fff;cursor:pointer;box-shadow:0 5px 0 #c4503c;transition:transform .12s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c4503c}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #ffd35c;outline-offset:3px}
.center{text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-weight:700;color:var(--muted);font-size:.95rem}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#27c2b0,#1fa6d6);border-radius:99px;transition:width .4s}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;font:inherit;font-weight:600;font-size:1.03rem;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--sea-mid);transform:translateX(3px)}
.opt .k{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-family:"Fredoka",sans-serif}
.opt:disabled{cursor:default}
.opt.good{border-color:var(--good);background:rgba(31,157,107,.14)}.opt.good .k{background:var(--good);color:#fff}
.opt.bad{border-color:var(--bad);background:rgba(214,69,61,.12);animation:shake .35s}.opt.bad .k{background:var(--bad);color:#fff}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}
.fact{margin-top:16px;padding:14px 16px;border-radius:16px;background:rgba(243,223,168,.45);border-left:6px solid var(--coral);display:none}
.fact b{font-family:"Fredoka",sans-serif;font-weight:500}
.next{margin-top:16px;display:none}
.saved{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.saved img{width:46px;height:auto}
.score{font-family:"Fredoka",sans-serif;font-size:3.2rem;font-weight:600;color:var(--coral)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){.swimmer,.swimmer img,.bubble,.hero-turtle{animation:none!important}.swimmer{left:20%}}
</style>
</head>
<body>
<div id="sea" aria-hidden="true"></div>
<main>
  <section id="start" class="card center">
    <img class="hero-turtle" id="heroImg" alt="Une tortue caouanne qui nage">
    <h1>Sauve la tortue caouanne</h1>
    <p class="lead">10 questions pour découvrir cette tortue marine et apprendre comment la protéger. Chaque bonne réponse sauve une tortue !</p>
    <button class="btn" id="go">Commencer</button>
  </section>

  <section id="quiz" class="card hide">
    <div class="top"><span id="count"></span><span id="pts"></span></div>
    <div class="bar"><i id="fill"></i></div>
    <h2 id="q"></h2>
    <div class="opts" id="opts"></div>
    <div class="fact" id="fact" role="status" aria-live="polite"></div>
    <div class="center"><button class="btn next" id="next">Question suivante</button></div>
  </section>

  <section id="end" class="card center hide">
    <h2>Partie terminée</h2>
    <div class="score" id="final"></div>
    <div class="saved" id="saved"></div>
    <p id="msg" class="lead"></p>
    <button class="btn" id="again">Rejouer</button>
  </section>
</main>

const QUESTIONS=[
 {q:"Où vit principalement la tortue caouanne ?",a:["Dans les déserts","Dans les océans et mers chaudes","Dans les forêts tropicales"],c:1,f:"Elle parcourt de très longues distances en mer, y compris en Méditerranée."},
 {q:"Que mange la tortue caouanne ?",a:["Des méduses, crustacés et coquillages","Uniquement des algues","Des fruits"],c:0,f:"Ses mâchoires puissantes lui permettent de broyer les coquilles. Son nom anglais, loggerhead, vient de sa grosse tête."},
 {q:"Pourquoi les plages sont-elles importantes pour la tortue caouanne ?",a:["Pour dormir toute l’année","Pour pondre ses œufs","Pour trouver de l’eau"],c:1,f:"Les femelles reviennent pondre sur la plage où elles sont nées, parfois des décennies plus tard."},
 {q:"De quelle couleur une tortue caouanne est-elle ?",a:["Bleue","Verte marron","Marron jaune"],c:2,f:"Sa carapace est brun-rouge et son ventre jaunâtre, comme sur le dessin."},
 {q:"Quelle est l’une des plus grandes menaces pour la tortue caouanne ?",a:["La pollution plastique","Le froid de l’hiver","Les montagnes"],c:0,f:"Les tortues avalent des déchets plastique en les prenant pour de la nourriture."},
 {q:"Pour quel animal marin les tortues confondent-elles souvent les sacs plastique ?",a:["Des cailloux","Des méduses","Des feuilles de palmier"],c:1,f:"Un sac qui flotte ressemble à une méduse. Mal digéré, il peut bloquer l’estomac de la tortue."},
 {q:"Que faire si tu trouves des traces ou un nid de tortue sur une plage ?",a:["Prendre quelques œufs en souvenir","Ne pas y toucher et prévenir une association ou les autorités","Y planter un parasol"],c:1,f:"Les œufs sont fragiles : seuls des spécialistes peuvent les protéger sans les abîmer."},
 {q:"Pourquoi les lumières vives sur la plage sont-elles un problème ?",a:["Elles désorientent les bébés tortues","Elles font fondre le sable","Elles endorment les tortues"],c:0,f:"Les bébés suivent normalement la lueur de la mer. Les lampadaires les entraînent vers la route."},
 {q:"Comment la tortue caouanne respire-t-elle ?",a:["Avec des branchies","Elle remonte à la surface prendre de l’air","Par sa carapace"],c:1,f:"C’est un reptile à poumons. Prise dans un filet de pêche, elle ne peut plus remonter et se noie."},
 {q:"Quel geste simple aide à protéger les tortues ?",a:["Laisser ses déchets sur la plage","Utiliser moins de plastique à usage unique","Donner du pain aux tortues"],c:1,f:"Gourde, sac en tissu, pailles évitées : moins de plastique, moins de déchets dans la mer."}
];

/* ---- decor: swimming turtles + bubbles ---- */
const sea=document.getElementById("sea");
[
 {t:6, w:210,d:46,s:-8, dir:"R",o:.9},
 {t:24,w:120,d:62,s:-40,dir:"L",o:.75},
 {t:44,w:260,d:58,s:-22,dir:"L",o:.95},
 {t:64,w:150,d:70,s:-55,dir:"R",o:.8},
 {t:80,w:190,d:52,s:-30,dir:"R",o:.9},
 {t:90,w:90, d:80,s:-12,dir:"L",o:.6}
].forEach(c=>{
  const d=document.createElement("div");
  d.className="swimmer "+(c.dir==="L"?"l":"");
  d.style.cssText=`top:${c.t}%;width:${c.w}px;opacity:${c.o};animation-name:${c.dir==="L"?"goL":"goR"};animation-duration:${c.d}s;animation-delay:${c.s}s`;
  const i=document.createElement("img");i.src=TURTLE;i.alt="";
  i.style.animationDelay=(c.s/3)+"s";
  d.appendChild(i);sea.appendChild(d);
});
for(let n=0;n<14;n++){
  const b=document.createElement("span"),z=6+Math.random()*16;
  b.className="bubble";
  b.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${10+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;
  sea.appendChild(b);
}
document.getElementById("heroImg").src=TURTLE;

/* ---- game ---- */
const $=id=>document.getElementById(id);
let order,idx,score,locked;
const LETTERS=["A","B","C"];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){["start","quiz","end"].forEach(s=>$(s).classList.toggle("hide",s!==id));window.scrollTo(0,0)}
function start(){order=QUESTIONS.slice();idx=0;score=0;show("quiz");render()}
function render(){
  const item=order[idx];locked=false;
  $("count").textContent="Question "+(idx+1)+" sur "+order.length;
  $("pts").textContent="Tortues sauvées : "+score;
  $("fill").style.width=(idx/order.length*100)+"%";
  $("q").textContent=item.q;
  $("fact").style.display="none";$("next").style.display="none";
  $("next").textContent=idx===order.length-1?"Voir mon résultat":"Question suivante";
  const box=$("opts");box.innerHTML="";
  shuffle(item.a.map((t,i)=>({t,ok:i===item.c}))).forEach((o,k)=>{
    const b=document.createElement("button");b.className="opt";b.type="button";
    b.innerHTML='<span class="k">'+LETTERS[k]+'</span><span></span>';
    b.lastChild.textContent=o.t;
    b.onclick=()=>answer(b,o.ok);
    box.appendChild(b);b.dataset.ok=o.ok;
  });
}
function answer(btn,ok){
  if(locked)return;locked=true;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.ok==="true")b.classList.add("good")});
  if(ok)score++;else btn.classList.add("bad");
  $("pts").textContent="Tortues sauvées : "+score;
  $("fill").style.width=((idx+1)/order.length*100)+"%";
  const f=$("fact");
  f.innerHTML="<b>"+(ok?"Bravo ! ":"Pas tout à fait. ")+"</b>";
  f.appendChild(document.createTextNode(order[idx].f));
  f.style.display="block";$("next").style.display="inline-block";$("next").focus();
}
function next(){idx++;if(idx<order.length)render();else finish()}
function finish(){
  $("final").textContent=score+" / "+order.length;
  const s=$("saved");s.innerHTML="";
  for(let i=0;i<score;i++){const im=document.createElement("img");im.src=TURTLE;im.alt="";s.appendChild(im)}
  $("msg").textContent=score===10?"Parfait ! Tu es un vrai gardien des tortues. Parle-en autour de toi."
    :score>=7?"Très bien ! Tu connais bien la tortue caouanne. Encore un essai pour le sans-faute ?"
    :score>=4?"Pas mal ! Rejoue pour mieux la connaître et mieux la protéger."
    :"C’est un début. Rejoue : chaque réponse t’apprend quelque chose sur ces tortues.";
  show("end");
}
$("go").onclick=start;$("next").onclick=next;$("again").onclick=start;
</script>
